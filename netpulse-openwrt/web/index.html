<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NetPulse OpenWrt</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">NP</span>
      <div>
        <h1>NetPulse OpenWrt</h1>
        <p>网络流量监控与防火墙实验台</p>
      </div>
    </div>
    <nav class="tabs" aria-label="功能切换">
      <button class="tab active" data-tab="traffic" type="button">流量监控</button>
      <button class="tab" data-tab="firewall" type="button">防火墙配置</button>
    </nav>
    <div class="connection">
      <span class="dot" id="statusDot"></span>
      <span id="status">等待连接</span>
    </div>
  </header>

  <main>
    <section id="traffic" class="panel active">
      <div class="section-head">
        <div>
          <h2>实时流量</h2>
          <p id="lastUpdate">-</p>
        </div>
        <div class="live-rate">
          <span>当前速率</span>
          <strong id="liveRate">0 bps</strong>
        </div>
      </div>

      <div class="metric-grid">
        <div class="metric">
          <span>接口</span>
          <strong id="iface">-</strong>
        </div>
        <div class="metric">
          <span>IP 数量</span>
          <strong id="ipCount">0</strong>
        </div>
        <div class="metric">
          <span>总流量</span>
          <strong id="totalTraffic">0 B</strong>
        </div>
        <div class="metric">
          <span>峰值速率</span>
          <strong id="peakRate">0 bps</strong>
        </div>
      </div>

      <div class="chart-wrap">
        <div class="chart-title">
          <span>过去 40 秒总速率</span>
          <strong id="chartScale">0 bps</strong>
        </div>
        <canvas id="trafficChart" width="1100" height="260"></canvas>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>IP 地址</th>
              <th>接收</th>
              <th>发送</th>
              <th>峰值</th>
              <th>2s 平均</th>
              <th>10s 平均</th>
              <th>40s 平均</th>
              <th>最后出现</th>
            </tr>
          </thead>
          <tbody id="trafficRows">
            <tr><td colspan="8" class="empty">暂无流量数据</td></tr>
          </tbody>
        </table>
      </div>
    </section>

    <section id="firewall" class="panel">
      <form id="ruleForm" class="rule-form">
        <label>
          协议
          <select name="protocol">
            <option value="tcp">TCP</option>
            <option value="udp">UDP</option>
            <option value="icmp">ICMP</option>
            <option value="all">ALL</option>
          </select>
        </label>
        <label>
          源地址
          <input name="src" placeholder="any 或 192.168.1.10">
        </label>
        <label>
          目的地址
          <input name="dst" placeholder="any 或 8.8.8.8">
        </label>
        <label>
          端口
          <input name="port" placeholder="TCP/UDP 可填">
        </label>
        <label>
          动作
          <select name="action">
            <option value="drop">DROP</option>
            <option value="reject">REJECT</option>
            <option value="accept">ACCEPT</option>
          </select>
        </label>
        <button type="submit" class="primary">新增规则</button>
      </form>

      <div class="firewall-layout">
        <div class="rule-tools">
          <div class="actions">
            <button id="refreshRules" type="button">刷新规则</button>
            <button id="clearRules" type="button" class="danger">清空实验规则</button>
          </div>

          <div class="delete-row">
            <input id="deleteId" placeholder="规则 ID">
            <button id="deleteRule" type="button">删除规则</button>
          </div>
        </div>

        <div class="console">
          <div class="console-head">
            <span>nftables 输出</span>
            <strong id="firewallState">未执行</strong>
          </div>
          <pre id="firewallOutput">等待规则操作</pre>
        </div>
      </div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
